name: Bug report
description: Something does not work as described in the user guide
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! **Do not paste Wi-Fi passwords, MAC/Bluetooth addresses or IP addresses** – replace
        them with `AA:BB:CC:DD:EE:FF` / `192.168.x.x`.
  - type: input
    id: version
    attributes:
      label: Firmware version
      description: Shown at the bottom of the setup panel or in the `STATUS` line on the serial console.
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    id: board
    attributes:
      label: Board
      placeholder: ESP32-C6-DevKitM-1
    validations:
      required: true
  - type: dropdown
    id: console
    attributes:
      label: Console state before the wake attempt
      options: [Rest mode, Fully off, Not relevant]
  - type: input
    id: sender
    attributes:
      label: Wake-on-LAN sender
      description: App or router (model / firmware), and which MAC you send to (ESP32 or PS5).
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
      description: Include the LED colours you saw.
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Serial log (optional)
      description: Output at 115200 baud, including the `STATUS` line. Remove addresses first.
      render: text
