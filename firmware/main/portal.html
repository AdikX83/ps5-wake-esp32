<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PS5 Wake</title>
<style>
:root{--bg:#0f1115;--card:#181b22;--line:#2a2f3a;--text:#e8eaf0;--muted:#9aa3b2;--acc:#3b82f6;--ok:#22c55e;--bad:#ef4444;--warn:#f59e0b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","PingFang SC","Hiragino Sans","Malgun Gothic",sans-serif}
header{position:sticky;top:0;z-index:2;background:#12151b;border-bottom:1px solid var(--line)}
.bar{max-width:600px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.bar h1{font-size:18px;margin:0;flex:1}
.bar select{width:auto;max-width:170px;padding:6px 8px;font-size:14px}
.icon{width:36px;height:36px;padding:0;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;flex:none}
.icon svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round}
#wake{background:var(--acc);border-color:var(--acc);color:#fff}
.pw{position:relative;display:inline-flex}
.pdot{position:absolute;right:-2px;bottom:-2px;width:13px;height:13px;border-radius:50%;border:2px solid #12151b;background:#6b7280}
.pdot.on{background:var(--ok)}.pdot.standby{background:var(--warn)}.pdot.off{background:var(--bad)}
main{max-width:600px;margin:0 auto;padding:14px 16px 28px}
.sub{color:var(--muted);font-size:13px;margin-bottom:14px}
section,details{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
summary{cursor:pointer;font-weight:600}
ol{margin:10px 0 0;padding-left:22px}ol li{margin-bottom:7px}
h2{font-size:15px;margin:0 0 10px}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
input,select{width:100%;padding:9px 10px;border-radius:7px;border:1px solid var(--line);background:#0f1218;color:var(--text);font-size:15px}
input[type=checkbox]{width:auto;margin:0 8px 0 0}
.chk{display:flex;align-items:center;color:var(--text);font-size:14px;margin-top:10px}
.row{display:flex;gap:8px}.row>input{flex:1}
button,.dl{padding:10px 14px;border-radius:7px;border:1px solid var(--line);background:#232836;color:var(--text);font-size:15px;cursor:pointer;text-decoration:none;display:inline-block}
button.primary{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
button:disabled{opacity:.5}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.dls{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}.dl{font-size:14px;padding:8px 12px}
button.mini{padding:3px 10px;font-size:12.5px;margin-left:4px;vertical-align:baseline}
.hint{color:var(--muted);font-size:12.5px;margin-top:6px}
a{color:var(--acc)}
dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:0;font-size:14px}
dt{color:var(--muted)}dd{margin:0;word-break:break-all}
.ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}
#msg{display:none;padding:10px 12px;border-radius:8px;margin-bottom:12px;font-size:14px}
#msg.ok{display:block;background:#0f2a1a;border:1px solid #1f6b3a;color:#bdf5cf}
#msg.bad{display:block;background:#2a1012;border:1px solid #7a2027;color:#ffd0d4}
</style>
</head>
<body>
<header><div class="bar">
<h1 data-t="title">PS5 Wake</h1>
<span class="pw"><button type="button" id="wake" class="icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v8"/><path d="M6.3 6.8a8 8 0 1 0 11.4 0"/></svg></button><span class="pdot" id="pdot"></span></span>
<select id="lang" aria-label="Language"></select>
<button type="button" id="exit" class="icon" style="display:none"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
</div></header>
<main>
<div class="sub"><span id="sub"></span> <button type="button" id="extend" class="mini" data-t="ext"></button></div>
<div id="msg"></div>

<details id="guide">
<summary data-t="guide"></summary>
<ol><li data-t="g1"></li><li data-t="g2"></li><li data-t="g3"></li><li data-t="g4"></li><li data-t="g5"></li><li data-t="g6"></li><li data-t="g7"></li></ol>
</details>

<section>
<h2 data-t="status"></h2>
<dl>
<dt data-t="addr"></dt><dd style="white-space:nowrap"><a id="paddr" href="https://192.168.4.1/" style="color:var(--text)"><b id="paddrt">https://192.168.4.1</b></a> <span style="color:var(--muted)">(<span id="hostn">ps5-wake.local</span>)</span></dd>
<dt data-t="wifi"></dt><dd id="s_wifi">–</dd>
<dt data-t="s_console"></dt><dd id="s_console">–</dd>
<dt data-t="ip"></dt><dd id="s_ip">–</dd>
<dt data-t="s_mqtt" class="r_mqtt"></dt><dd id="s_mqtt" class="r_mqtt"></dd>
<dt data-t="last"></dt><dd id="s_wake">–</dd>
<dt data-t="wolcnt"></dt><dd id="s_wol">–</dd>
</dl>
</section>

<form id="f" autocomplete="off">
<section>
<h2 data-t="wifisec"></h2>
<label for="ssid" data-t="ssid"></label>
<div class="row"><input id="ssid" list="nets" maxlength="32" required><button type="button" id="scan" data-t="scan"></button></div>
<datalist id="nets"></datalist>
<label for="pass" data-t="pass"></label>
<input id="pass" type="password" maxlength="64">
<label class="chk"><input type="checkbox" id="open"><span data-t="open"></span></label>
<label for="country" data-t="country"></label>
<select id="country"></select>
<div class="hint" data-t="countryhint"></div>
<div class="hint warn" id="chwarn"></div>
</section>

<section>
<h2 data-t="btsec"></h2>
<div class="hint" style="margin-top:0"><span data-t="dl"></span></div>
<div class="dls">
<a class="dl" href="/download/ps5-wake-reader.cmd" download data-t="dlwin"></a>
<a class="dl" href="/download/ps5_wake_reader.py" download data-t="dlpy"></a>
</div>
<div class="hint" data-t="dlhint"></div>
<label for="code" data-t="code"></label>
<input id="code" data-p="codeph" autocapitalize="characters" spellcheck="false">
<label for="ps5" data-t="ps5"></label>
<input id="ps5" placeholder="AA:BB:CC:DD:EE:FF" maxlength="17" required spellcheck="false">
<label for="pad" data-t="pad"></label>
<input id="pad" placeholder="AA:BB:CC:DD:EE:FF" maxlength="17" required spellcheck="false">
</section>

<section>
<h2 data-t="wolsec"></h2>
<dl><dt data-t="espmac"></dt><dd id="espmac">–</dd></dl>
<div class="hint" data-t="wolhint"></div>
<label for="wolps5" data-t="wolps5"></label>
<input id="wolps5" data-p="wolps5ph" maxlength="17" spellcheck="false">
<div class="hint" data-t="wolps5hint"></div>
<div class="hint" data-t="wolps5note"></div>
<div id="consoles" class="hint"></div>
</section>

<section>
<h2 data-t="ledsec"></h2>
<label class="chk"><input type="checkbox" id="ledoff"><span data-t="ledoff"></span></label>
<label class="chk"><input type="checkbox" id="leddark"><span data-t="ledall"></span></label>
<div class="hint" data-t="ledallhint"></div>
<label for="devname" data-t="devname"></label>
<input id="devname" maxlength="24" spellcheck="false">
<div class="hint" data-t="devnamehint"></div>
<label for="puser" data-t="puser"></label>
<input id="puser" maxlength="32" spellcheck="false" autocomplete="username" placeholder="admin">
<label for="appass" data-t="appass"></label>
<input id="appass" type="password" maxlength="63" data-p="appassph">
<label class="chk"><input type="checkbox" id="portalon"><span data-t="always"></span></label>
<div class="hint" data-t="alwayshint"></div>
<label class="chk"><input type="checkbox" id="https" checked><span data-t="https"></span></label>
<div class="hint" data-t="httpshint"></div>
<div class="hint" id="certbox" style="display:none"><span data-t="certfp"></span><code id="certfp" style="display:block;word-break:break-all;margin:2px 0 6px"></code>
<span data-t="certexp"></span> <b id="certexp"></b> · <a href="/download/ps5-wake.crt" data-t="dlcert"></a>
<button type="button" id="newcert" class="mini" data-t="newcert" style="margin-left:6px"></button></div>
</section>

<section>
<h2>Home Assistant (MQTT)</h2>
<label class="chk"><input type="checkbox" id="mqtton"><span data-t="mqtton"></span></label>
<div id="mqttbox">
<label for="mqtturl" data-t="mqtturl"></label>
<input id="mqtturl" maxlength="128" spellcheck="false" placeholder="mqtt://192.168.1.10:1883">
<label for="mqttuser" data-t="mqttuser"></label>
<input id="mqttuser" maxlength="64" spellcheck="false" autocomplete="off">
<label for="mqttpass" data-t="mqttpass"></label>
<input id="mqttpass" type="password" maxlength="64" data-p="mqttpassph" autocomplete="new-password">
</div>
<div class="hint" data-t="mqtthint"></div>
</section>

<div class="btns">
<button type="submit" class="primary" id="save" data-t="save"></button>
</div>
</form>
<div class="hint" id="ver" style="text-align:center;margin-top:18px"></div>
</main>

de:{ledall:"LED vollständig ausschalten",ledallhint:"Keine Farben, kein Blinken und keine Blitze. Nur solange du BOOT hältst, zeigt die LED weiterhin die Haltedauer.",devname:"Gerätename (optional)",devnamehint:"Z. B. Wohnzimmer. Wird in der Panel-Adresse (wohnzimmer.local), in Home Assistant und im Seitentitel verwendet – hilfreich bei mehreren Geräten.",e_devname:"Gerätename: höchstens 24 Zeichen.",consfound:"Im Netzwerk gefundene Konsolen:",choose:"Auswählen",w_multi:"Im Netzwerk antworten mehrere Konsolen – wähle deine, damit der angezeigte Konsolenstatus stimmt.",s_console:"Konsole",ps_on:"eingeschaltet",ps_standby:"Ruhemodus",ps_off:"aus oder nicht erreichbar",ps_unknown:"noch nicht gefunden",c_auto:"Automatisch (vom Router)",countryhint:"Einstellen, wenn dein Router Kanal 12 oder 13 nutzt. Das Land bestimmt die erlaubten WLAN-Kanäle und die Sendeleistung.",w_ch:"Dieses Netz nutzt Kanal {c} – wähle dein Land, sonst findet der ESP32 es eventuell nicht.",puser:"Benutzername des Panels",e_puser:"Benutzername des Panels: 3–32 Zeichen, kein Doppelpunkt.",mqtton:"Mit Home Assistant verbinden",mqtturl:"Adresse des MQTT-Brokers",mqttuser:"MQTT-Benutzername",mqttpass:"MQTT-Passwort",mqttpassph:"leer lassen, um das gespeicherte zu behalten",mqtthint:"Erfordert das Add-on Mosquitto broker und die MQTT-Integration in Home Assistant. PS5 Wake erscheint dann automatisch als Gerät mit einer Aufwecken-Taste, die du in Automationen verwenden kannst.",s_mqtt:"Home Assistant",mqtt_ok:"verbunden",mqtt_no:"nicht verbunden",e_mqtt:"Gib die Broker-Adresse als mqtt://host:port (oder mqtts://) ein.",https:"Verschlüsselte Verbindung (HTTPS)",httpshint:"Empfohlen. Der ESP32 erstellt ein eigenes Zertifikat, daher warnt der Browser beim ersten Besuch, dass die Verbindung nicht privat ist – vergleiche den Fingerabdruck unten und fahre fort. Ohne HTTPS werden Passwort und Einstellungen unverschlüsselt im Netzwerk übertragen.",certfp:"Zertifikat-Fingerabdruck (SHA-256):",certexp:"Gültig bis:",dlcert:"Zertifikat herunterladen",newcert:"Neues Zertifikat",m_newcert:"Ein neues Zertifikat wird erstellt. Lade die Seite in etwa 10 Sekunden neu und bestätige die Browserwarnung erneut.",e_appass:"Lege ein eigenes Passwort für das Panel-Netzwerk fest (8–63 Zeichen) – das Standardpasswort ist öffentlich bekannt.",appassreq:"erforderlich – mind. 8 Zeichen (das Standardpasswort ist öffentlich)",always:"Zugriff aus dem Heimnetz",alwayshint:"Die Seite bleibt im Heimnetz unter <IP des ESP32> und ps5-wake-xxxx.local erreichbar – Anmeldung mit dem Panel-Passwort (Benutzername admin, sofern nicht geändert). Das Panel-WLAN wird nicht gestartet; halte BOOT 5 s, um es zu öffnen.",wolps5note:"In Mesh-Netzwerken (z. B. ASUS AiMesh) erreicht ein Paket an die MAC der Konsole den ESP32 eventuell nicht – wenn die PS5 nicht aufwacht, sende WoL an die MAC dieses ESP32.",addr:"Panel-Adresse",ext:"Verlängern (+10 Min.)",m_ext:"Zeit verlängert – das Panel bleibt weitere 10 Minuten an.",title:"PS5 Wake – Einrichtung",sub:"Das Panel schaltet sich nach {t} ohne Aktivität selbst ab. Nach dem Speichern startet der ESP32 neu und das Panel wird geschlossen.",guide:"Schritt-für-Schritt-Anleitung",
g1:"Kopple den DualSense-Controller wie gewohnt mit deiner PS5 – er muss bereits mit der Konsole funktionieren.",
g2:"Verbinde den Controller mit einem USB-Datenkabel mit diesem Computer. Die Konsole kann ausgeschaltet oder im Ruhemodus bleiben.",
g3:"Lade das Adress-Leseprogramm herunter und starte es (Abschnitt „Bluetooth“ unten). Es zeigt beide Bluetooth-Adressen und kopiert einen Einrichtungscode in die Zwischenablage.",
g4:"Füge den Code in das Feld „Einrichtungscode“ ein, wähle dein WLAN (2,4 GHz) und gib das Passwort ein.",
g5:"Klicke auf „Speichern und neu starten“. Die LED blinkt beim Verbinden blau und leuchtet grün, wenn alles bereit ist.",
g6:"Trage in deiner Wake-on-LAN-App die MAC des ESP32 aus dem Abschnitt „Wake-on-LAN“ ein (UDP-Port 9, Broadcast-Adresse). Tipp: Reserviere im Router eine feste IP-Adresse für den ESP32.",
g7:"Zum Aufwecken der PS5 sende ein WoL-Paket oder drücke kurz BOOT am ESP32. Halte BOOT 5–20 s gedrückt, um dieses Panel wieder zu öffnen, oder 20 s, um alle Einstellungen zu löschen.",

fr:{ledall:"Éteindre complètement la LED",ledallhint:"Aucune couleur, aucun clignotement ni flash. La LED indique seulement la durée d’appui pendant que vous maintenez BOOT.",devname:"Nom de l’appareil (facultatif)",devnamehint:"Par ex. Salon. Utilisé dans l’adresse du panneau (salon.local), dans Home Assistant et dans le titre de la page – utile avec plusieurs appareils.",e_devname:"Nom de l’appareil : 24 caractères maximum.",consfound:"Consoles trouvées sur le réseau :",choose:"Choisir",w_multi:"Plusieurs consoles répondent sur le réseau – choisissez la vôtre pour que l’état affiché soit correct.",s_console:"Console",ps_on:"allumée",ps_standby:"mode repos",ps_off:"éteinte ou injoignable",ps_unknown:"pas encore détectée",c_auto:"Automatique (depuis le routeur)",countryhint:"À définir si votre routeur utilise le canal 12 ou 13. Le pays détermine les canaux Wi-Fi autorisés et la puissance d’émission.",w_ch:"Ce réseau utilise le canal {c} – choisissez votre pays, sinon l’ESP32 risque de ne pas le trouver.",puser:"Nom d’utilisateur du panneau",e_puser:"Nom d’utilisateur du panneau : 3 à 32 caractères, sans deux-points.",mqtton:"Se connecter à Home Assistant",mqtturl:"Adresse du broker MQTT",mqttuser:"Nom d’utilisateur MQTT",mqttpass:"Mot de passe MQTT",mqttpassph:"laisser vide pour conserver celui enregistré",mqtthint:"Nécessite le module complémentaire Mosquitto broker et l’intégration MQTT dans Home Assistant. PS5 Wake apparaît alors automatiquement comme appareil avec un bouton Réveiller utilisable dans les automatisations.",s_mqtt:"Home Assistant",mqtt_ok:"connecté",mqtt_no:"non connecté",e_mqtt:"Saisissez l’adresse du broker sous la forme mqtt://hôte:port (ou mqtts://).",https:"Connexion chiffrée (HTTPS)",httpshint:"Recommandé. L’ESP32 crée son propre certificat : lors de la première visite, le navigateur indique que la connexion n’est pas privée – comparez l’empreinte ci-dessous et continuez. Sans HTTPS, le mot de passe et les réglages circulent en clair sur votre réseau.",certfp:"Empreinte du certificat (SHA-256) :",certexp:"Valide jusqu’au :",dlcert:"Télécharger le certificat",newcert:"Nouveau certificat",m_newcert:"Un nouveau certificat est en cours de création. Rechargez la page dans environ 10 secondes et acceptez à nouveau l’avertissement du navigateur.",e_appass:"Définissez votre propre mot de passe pour le réseau du panneau (8 à 63 caractères) – celui par défaut est public.",appassreq:"obligatoire – au moins 8 caractères (celui par défaut est public)",always:"Accès depuis le réseau domestique",alwayshint:"La page reste accessible sur votre réseau domestique à <IP de l’ESP32> et ps5-wake-xxxx.local – connexion avec le mot de passe du panneau (nom d’utilisateur admin, sauf si vous l’avez changé). Le réseau Wi-Fi du panneau n’est pas lancé ; maintenez BOOT 5 s pour l’ouvrir.",wolps5note:"Dans les réseaux maillés (p. ex. ASUS AiMesh), un paquet destiné à la MAC de la console peut ne pas atteindre l’ESP32 – si la PS5 ne se réveille pas, envoyez le WoL à la MAC de cet ESP32.",addr:"Adresse du panneau",ext:"Prolonger (+10 min)",m_ext:"Durée prolongée – le panneau reste ouvert 10 minutes de plus.",title:"PS5 Wake – configuration",sub:"Le panneau se ferme tout seul après {t} sans activité. Après l’enregistrement, l’ESP32 redémarre et le panneau se ferme.",guide:"Guide pas à pas",
g1:"Associez la manette DualSense à votre PS5 comme d’habitude – elle doit déjà fonctionner avec la console.",
g2:"Branchez la manette sur cet ordinateur avec un câble USB de données. La console peut rester éteinte ou en mode repos.",
g3:"Téléchargez et lancez le lecteur d’adresses (section « Bluetooth » ci-dessous). Il affiche les deux adresses Bluetooth et copie un code de configuration dans le presse-papiers.",
g4:"Collez le code dans le champ « Code de configuration », choisissez votre réseau Wi-Fi (2,4 GHz) et saisissez son mot de passe.",
g5:"Cliquez sur « Enregistrer et redémarrer ». La LED clignote en bleu pendant la connexion puis devient verte quand tout est prêt.",
g6:"Dans votre application Wake-on-LAN, saisissez l’adresse MAC de l’ESP32 indiquée dans la section « Wake-on-LAN » (port UDP 9, adresse de diffusion). Astuce : réservez une adresse IP fixe pour l’ESP32 dans votre routeur.",
g7:"Pour réveiller la PS5, envoyez un paquet WoL ou appuyez brièvement sur BOOT de l’ESP32. Maintenez BOOT 5 à 20 s pour rouvrir ce panneau, ou 20 s pour effacer tous les réglages.",

es:{ledall:"Apagar el LED por completo",ledallhint:"Sin colores, parpadeos ni destellos. Solo mientras mantienes pulsado BOOT el LED sigue mostrando el tiempo de pulsación.",devname:"Nombre del dispositivo (opcional)",devnamehint:"Por ej. Salón. Se usa en la dirección del panel (salon.local), en Home Assistant y en el título de la página; útil con varios dispositivos.",e_devname:"Nombre del dispositivo: hasta 24 caracteres.",consfound:"Consolas encontradas en la red:",choose:"Elegir",w_multi:"Varias consolas responden en la red: elige la tuya para que el estado mostrado sea correcto.",s_console:"Consola",ps_on:"encendida",ps_standby:"modo de reposo",ps_off:"apagada o no accesible",ps_unknown:"aún no detectada",c_auto:"Automático (del router)",countryhint:"Ajústalo si tu router usa el canal 12 o 13. El país define los canales Wi-Fi permitidos y la potencia de emisión.",w_ch:"Esta red usa el canal {c}: elige tu país o el ESP32 podría no encontrarla.",puser:"Usuario del panel",e_puser:"Usuario del panel: de 3 a 32 caracteres, sin dos puntos.",mqtton:"Conectar con Home Assistant",mqtturl:"Dirección del broker MQTT",mqttuser:"Usuario MQTT",mqttpass:"Contraseña MQTT",mqttpassph:"déjalo vacío para conservar la guardada",mqtthint:"Requiere el complemento Mosquitto broker y la integración MQTT en Home Assistant. PS5 Wake aparecerá automáticamente como dispositivo con un botón Despertar que puedes usar en automatizaciones.",s_mqtt:"Home Assistant",mqtt_ok:"conectado",mqtt_no:"sin conexión",e_mqtt:"Introduce la dirección del broker como mqtt://host:puerto (o mqtts://).",https:"Conexión cifrada (HTTPS)",httpshint:"Recomendado. El ESP32 crea su propio certificado, así que en la primera visita el navegador avisará de que la conexión no es privada: compara la huella de abajo y continúa. Sin HTTPS, la contraseña y los ajustes viajan sin cifrar por tu red.",certfp:"Huella del certificado (SHA-256):",certexp:"Válido hasta:",dlcert:"Descargar certificado",newcert:"Nuevo certificado",m_newcert:"Se está creando un certificado nuevo. Recarga la página en unos 10 segundos y vuelve a aceptar el aviso del navegador.",e_appass:"Define tu propia contraseña para la red del panel (8–63 caracteres): la predeterminada es pública.",appassreq:"obligatoria – mínimo 8 caracteres (la predeterminada es pública)",always:"Acceso desde la red doméstica",alwayshint:"La página seguirá disponible en tu red doméstica en <IP del ESP32> y ps5-wake-xxxx.local: inicia sesión con la contraseña del panel (usuario admin, salvo que lo hayas cambiado). La red Wi-Fi del panel no se activa; mantén BOOT 5 s para abrirla.",wolps5note:"En redes mesh (p. ej. ASUS AiMesh) un paquete dirigido a la MAC de la consola puede no llegar al ESP32: si la PS5 no despierta, envía el WoL a la MAC de este ESP32.",addr:"Dirección del panel",ext:"Ampliar (+10 min)",m_ext:"Tiempo ampliado: el panel seguirá activo otros 10 minutos.",title:"PS5 Wake – configuración",sub:"El panel se apaga solo tras {t} sin actividad. Al guardar, el ESP32 se reinicia y el panel se cierra.",guide:"Guía paso a paso",
g1:"Empareja el mando DualSense con tu PS5 como siempre: debe funcionar ya con la consola.",
g2:"Conecta el mando a este ordenador con un cable USB de datos. La consola puede seguir apagada o en modo de reposo.",
g3:"Descarga y ejecuta el lector de direcciones (sección «Bluetooth» más abajo). Muestra ambas direcciones Bluetooth y copia un código de configuración al portapapeles.",

g6:"En tu aplicación de Wake-on-LAN introduce la MAC del ESP32 que aparece en la sección «Wake-on-LAN» (puerto UDP 9, dirección de difusión). Consejo: reserva una IP fija para el ESP32 en tu router.",
g7:"Para despertar la PS5, envía un paquete WoL o pulsa brevemente BOOT en el ESP32. Mantén BOOT 5–20 s para volver a abrir este panel o 20 s para borrar todos los ajustes.",

hu:{ledall:"A LED teljes kikapcsolása",ledallhint:"Semmilyen szín, villogás vagy villanás. A LED csak a BOOT lenyomva tartása közben mutatja továbbra is a nyomva tartás idejét.",devname:"Eszköz neve (nem kötelező)",devnamehint:"Pl. Nappali. A panel címében (nappali.local), a Home Assistantban és az oldal címében jelenik meg – több eszköz esetén hasznos.",e_devname:"Eszköz neve: legfeljebb 24 karakter.",consfound:"A hálózaton talált konzolok:",choose:"Kiválaszt",w_multi:"Több konzol válaszol a hálózaton – válassza ki a sajátját, hogy a megjelenített állapot helyes legyen.",s_console:"Konzol",ps_on:"bekapcsolva",ps_standby:"nyugalmi mód",ps_off:"kikapcsolva vagy nem elérhető",ps_unknown:"még nem található",c_auto:"Automatikus (a routertől)",countryhint:"Állítsa be, ha a router a 12. vagy 13. csatornát használja. Az ország határozza meg az engedélyezett Wi-Fi csatornákat és az adóteljesítményt.",w_ch:"Ez a hálózat a(z) {c}. csatornát használja – válassza ki az országot, különben az ESP32 nem biztos, hogy megtalálja.",puser:"A panel felhasználóneve",e_puser:"A panel felhasználóneve: 3–32 karakter, kettőspont nélkül.",mqtton:"Csatlakozás a Home Assistanthoz",mqtturl:"MQTT-bróker címe",mqttuser:"MQTT-felhasználónév",mqttpass:"MQTT-jelszó",mqttpassph:"hagyja üresen a mentett megtartásához",mqtthint:"A Home Assistantban szükséges a Mosquitto broker bővítmény és az MQTT-integráció. A PS5 Wake ezután automatikusan megjelenik eszközként egy Ébresztés gombbal, amely automatizálásokban használható.",s_mqtt:"Home Assistant",mqtt_ok:"csatlakozva",mqtt_no:"nincs kapcsolat",e_mqtt:"Adja meg a bróker címét mqtt://gazdagép:port (vagy mqtts://) formában.",https:"Titkosított kapcsolat (HTTPS)",httpshint:"Ajánlott. Az ESP32 saját tanúsítványt hoz létre, ezért az első látogatáskor a böngésző figyelmeztet, hogy a kapcsolat nem privát – hasonlítsa össze az alábbi ujjlenyomatot, és folytassa. HTTPS nélkül a jelszó és a beállítások titkosítatlanul haladnak át a hálózaton.",certfp:"Tanúsítvány g3:"Töltse le és indítsa el a címolvasót (lent, a „Bluetooth” részben). Megjeleníti mindkét Bluetooth-címet, és a vágólapra másol egy beállítókódot.",

тифікат. Оновіть сторінку приблизно через 10 секунд і знову прийміть попередження браузера.",e_appass:"Установіть власний пароль мережі панелі (8–63 символи) – стандартний пароль загальновідомий.",appassreq:"обов’язково – щонайменше 8 символів (стандартний пароль публічний)",always:"Доступ із домашньої мережі",alwayshint:"Сторінка постійно доступна в домашній мережі за адресою <IP ESP32> і ps5-wake-xxxx.local – вхід із паролем панелі (ім’я користувача admin, якщо ви його не змінювали). Wi-Fi-мережа панелі не запускається; щоб її відкрити, утримуйте BOOT 5 с.",wolps5note:"У mesh-мережах (напр. ASUS AiMesh) пакет для MAC-адреси консолі може не дійти до ESP32 – якщо PS5 не прокидається, надсилайте WoL на MAC-адресу цього ESP32.",addr:"Адреса панелі",ext:"Подовжити (+10 хв)",m_ext:"Час подовжено – панель залишиться увімкненою ще 10 хвилин.",title:"PS5 Wake – налаштування",sub:"Панель вимикається сама через {t} без активності. Після збереження ESP32 перезапускається, а панель закривається.",guide:"Покрокова інструкція",

  $("country").innerHTML=`<option value="">${esc(t("c_auto"))}</option>`+items.map(([c,n])=>`<option value="${c}">${esc(n)} (${c})</option>`).join("");

function apply(){

function wakeText(w){
  if(!w||w.status==-1)return esc(t("w_none"));
  const ago=w.seconds_ago>=0?` (${esc(t("w_ago",{s:w.seconds_ago}))})`:"";
  if(w.status==0&&w.lmp_rx>0)return `<span class="ok">${esc(t("w_ok"))}</span>${ago}`;
  if(w.status==-2)return `<span class="warn">${esc(t("w_wait"))}</span>${ago}`;
  return `<span class="bad">${esc(t("w_fail",{c:"0x"+w.status.toString(16)}))}</span>${ago}`;
}

  $("s_wake").innerHTML=S.busy?`<span class="warn">${esc(t("w_busy"))}</span>`:wakeText(S.last_wake);
  $("s_wol").textContent=S.wol_count;
  $("ver").innerHTML=`PS5 Wake ${esc(S.version||"")} · <a href="https://github.com/AdikX83/ps5-wake-esp32" target="_blank" rel="noopener">GitHub</a> · <a href="https://github.com/AdikX83/ps5-wake-esp32/blob/main/docs/technical/api.md" target="_blank" rel="noopener">REST API</a>`;
  document.querySelectorAll(".r_mqtt").forEach(e=>e.style.display=S.mqtt_on?"":"none");$("s_mqtt").innerHTML=S.mqtt_connected?`<span class="ok">${esc(t("mqtt_ok"))}</span>`:`<span class="warn">${esc(t("mqtt_no"))}</span>`;
  $("espmac").textContent=S.wol_mac||S.esp_mac;
  $("wake").disabled=!S.configured||S.busy;
  $("pass").placeholder=S.configured?t("passkeep"):t("passnew");
  $("appass").placeholder=S.ap_custom?t("appassph"):t("appassreq");
}
async function status(){
  try{
    S=await (await fetch("/api/status")).json();
    if(!filled){
      filled=true;
      if(S.lang&&T[S.lang]){L=S.lang;$("lang").value=L}
      $("ssid").value=S.ssid||"";$("ps5").value=S.ps5_bt||"";$("pad").value=S.controller_bt||"";
      $("wolps5").value=S.wol_ps5||"";$("ledoff").checked=!!S.led_idle_off;$("leddark").checked=!!S.led_dark;$("portalon").checked=!!S.portal_always;$("https").checked=S.https!==false;$("puser").value=S.panel_user||"admin";$("devname").value=S.device_name||"";if(!S.country_set){const r=browserRegion();if(r){countries();if([...$("country").options].some(o=>o.value===r))$("country").value=r;}}$("mqtton").checked=!!S.mqtt_on;$("mqtturl").value=S.mqtt_url||"";$("mqttuser").value=S.mqtt_user||"";$("mqttbox").style.display=S.mqtt_on?"":"none";
      if(!S.configured)$("guide").open=true;
      apply();
    }
    render();
  }catch(e){}
}
function browserRegion(){
  for(const l of (navigator.languages||[navigator.language||""])){const m=/[-_]([A-Za-z]{2})$/.exec(l||"");if(m)return m[1].toUpperCase();}
  return "";
}
function chanWarn(){
  const n=(scanned||[]).find(x=>x.ssid===$("ssid").value);
  $("chwarn").textContent=n&&n.channel>=12&&!$("country").value?t("w_ch",{c:n.channel}):"";
}
function fillNets(){
  $("nets").innerHTML="";
  setTimeout(chanWarn,0);
  scanned.forEach(n=>{const o=document.createElement("option");o.value=n.ssid;o.label=`${n.rssi} dBm, ${t("m_chan",{c:n.channel})}${n.open?", "+t("m_open"):""}`;$("nets").appendChild(o)});
}
$("lang").innerHTML=Object.keys(NAMES).map(k=>`<option value="${k}">${NAMES[k]}</option>`).join("");
$("lang").onchange=()=>{L=$("lang").value;apply();fetch("/api/lang",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({lang:L})}).catch(()=>{})};
$("code").addEventListener("input",()=>{
  const v=$("code").value.trim().toUpperCase();if(!v)return;
  const m=v.match(/^PS5WAKE:\s*((?:[0-9A-F]{2}:){5}[0-9A-F]{2})\s*,\s*((?:[0-9A-F]{2}:){5}[0-9A-F]{2})$/);
  if(m){$("ps5").value=m[1];$("pad").value=m[2];msg("m_codeok",true)}else if(v.length>=40)msg("m_codebad",false);
});
$("scan").onclick=async()=>{
  $("scan").disabled=true;$("scan").textContent=t("scanning");
  try{
    const r=await (await fetch("/api/scan")).json();
    scanned=r.networks.sort((a,b)=>b.rssi-a.rssi);fillNets();
    scanned.length?msg("m_found",true,{n:scanned.length}):msg("m_none",false);
  }catch(e){msg("m_scanfail",false)}
  $("scan").disabled=false;$("scan").textContent=t("scan");
};
$("f").onsubmit=async e=>{
  e.preventDefault();
  for(const id of ["ps5","pad"])if(!MAC.test($(id).value.trim()))return msg("m_btfmt",false);
  if($("wolps5").value.trim()&&!MAC.test($("wolps5").value.trim()))return msg("m_macfmt",false);
  if($("appass").value&&$("appass").value.length<8)return msg("m_aplen",false);
  if(S&&!S.ap_custom&&!$("appass").value)return msg("e_appass",false);
  const body={ssid:$("ssid").value.trim(),password:$("pass").value,open:$("open").checked,country:$("country").value,
    ps5_bt:$("ps5").value.trim().toUpperCase(),controller_bt:$("pad").value.trim().toUpperCase(),
    wol_ps5:$("wolps5").value.trim().toUpperCase(),led_idle_off:$("ledoff").checked,led_dark:$("leddark").checked,portal_always:$("portalon").checked,https:$("https").checked,panel_user:$("puser").value.trim(),device_name:$("devname").value.trim(),mqtt_on:$("mqtton").checked,mqtt_url:$("mqtturl").value.trim(),mqtt_user:$("mqtturl").value.trim()?$("mqttuser").value.trim():"",mqtt_pass:$("mqttpass").value,ap_password:$("appass").value,lang:L};
  $("save").disabled=true;
  try{
    const r=await (await fetch("/api/save",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)})).json();
    if(r.ok){msg("m_saved",true);document.querySelectorAll("form button,form input,form select").forEach(x=>x.disabled=true);return}
    const map={bt:"m_btfmt",wol:"m_macfmt",ap:"m_aplen"};
    const key=map[r.error]||("e_"+r.error);
    msg("m_notsaved",false,{e:T.en[key]?t(key):r.error});
  }catch(e){msg("m_noreply",false)}
  $("save").disabled=false;
};
$("ssid").addEventListener("input",chanWarn);$("country").addEventListener("change",chanWarn);
$("mqtton").onchange=()=>{$("mqttbox").style.display=$("mqtton").checked?"":"none"};
$("newcert").onclick=async()=>{
  try{const r=await (await fetch("/api/newcert",{method:"POST"})).json();msg(r.ok?"m_newcert":"m_noreply",r.ok)}
  catch(e){msg("m_noreply",false)}
};
$("wake").onclick=async()=>{
  try{const r=await (await fetch("/api/wake",{method:"POST"})).json();msg(r.accepted?"m_wakesent":"m_wakerej",r.accepted)}
  catch(e){msg("m_noreply",false)}
};
$("extend").onclick=async()=>{
  try{const r=await (await fetch("/api/extend",{method:"POST"})).json();if(r.ok){msg("m_ext",true);status()}}
  catch(e){msg("m_noreply",false)}
};
$("exit").onclick=async()=>{
  if(!confirm(t("m_exitq")))return;
  try{await fetch("/api/exit",{method:"POST"})}catch(e){}
  msg("m_exited",true);document.querySelectorAll("form button,form input,form select").forEach(x=>x.disabled=true);
};
apply();status();setInterval(status,3000);
</script>
</body>
</html>
