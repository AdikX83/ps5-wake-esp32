<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <title>ESP32-C6-DevKitM-1 – parts used by PS5 Wake (illustration)</title>
  <rect width="720" height="420" fill="#f6f7f9"/>
  <!-- board -->
  <rect x="150" y="70" width="420" height="250" rx="10" fill="#1d3a5f" stroke="#0f2238" stroke-width="3"/>
  <!-- header pins -->
  <g fill="#c9a227">
    <g id="row">
      <circle cx="190" cy="88" r="4"/><circle cx="212" cy="88" r="4"/><circle cx="234" cy="88" r="4"/><circle cx="256" cy="88" r="4"/>
      <circle cx="278" cy="88" r="4"/><circle cx="300" cy="88" r="4"/><circle cx="322" cy="88" r="4"/><circle cx="344" cy="88" r="4"/>
      <circle cx="366" cy="88" r="4"/><circle cx="388" cy="88" r="4"/><circle cx="410" cy="88" r="4"/><circle cx="432" cy="88" r="4"/>
      <circle cx="454" cy="88" r="4"/><circle cx="476" cy="88" r="4"/><circle cx="498" cy="88" r="4"/>
    </g>
    <use href="#row" y="214"/>
  </g>
  <!-- module with antenna -->
  <rect x="440" y="112" width="118" height="168" rx="4" fill="#d9dde3" stroke="#8a929e" stroke-width="2"/>
  <rect x="440" y="112" width="40" height="168" fill="#1d3a5f" opacity="0.15"/>
  <path d="M452 126 h18 v20 h-12 v20 h12 v20 h-12 v20 h12 v20 h-12 v20 h12 v24" fill="none" stroke="#8a929e" stroke-width="3"/>
  <text x="519" y="190" font-size="13" text-anchor="middle" fill="#333">ESP32-C6</text>
  <text x="519" y="207" font-size="11" text-anchor="middle" fill="#555">module</text>
  <!-- USB ports -->
  <rect x="132" y="128" width="44" height="30" rx="8" fill="#b9bec6" stroke="#6b7280" stroke-width="2"/>
  <rect x="132" y="232" width="44" height="30" rx="8" fill="#b9bec6" stroke="#6b7280" stroke-width="2"/>
  <!-- buttons -->
  <rect x="220" y="122" width="34" height="26" rx="4" fill="#e5e7eb" stroke="#6b7280" stroke-width="2"/>
  <circle cx="237" cy="135" r="7" fill="#374151"/>
  <rect x="220" y="242" width="34" height="26" rx="4" fill="#e5e7eb" stroke="#6b7280" stroke-width="2"/>
  <circle cx="237" cy="255" r="7" fill="#374151"/>
  <!-- RGB LED -->
  <rect x="300" y="182" width="22" height="22" rx="3" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
  <circle cx="311" cy="193" r="7" fill="#22c55e"/>
  <!-- labels -->
  <g font-size="14" fill="#111827">
    <line x1="154" y1="143" x2="80" y2="143" stroke="#111827"/>
    <text x="12" y="138">USB-C</text><text x="12" y="155" font-size="12" fill="#4b5563">(USB)</text>
    <line x1="154" y1="247" x2="80" y2="247" stroke="#111827"/>
    <text x="12" y="242">USB-C</text><text x="12" y="259" font-size="12" fill="#4b5563">(UART)</text>
    <line x1="237" y1="122" x2="237" y2="40" stroke="#111827"/>
    <text x="200" y="32" font-weight="700">BOOT (GPIO9)</text>
    <line x1="237" y1="268" x2="237" y2="360" stroke="#111827"/>
    <text x="214" y="378">RESET</text>
    <line x1="322" y1="193" x2="390" y2="360" stroke="#111827"/>
    <text x="340" y="378" font-weight="700">RGB LED (GPIO8)</text>
  </g>
  <g font-size="12" fill="#374151">
    <text x="600" y="120" font-weight="700" font-size="13">PS5 Wake uses</text>
    <text x="600" y="142">• BOOT: wake,</text>
    <text x="612" y="158">panel, reset</text>
    <text x="600" y="180">• RGB LED:</text>
    <text x="612" y="196">status</text>
    <text x="600" y="218">• either USB-C:</text>
    <text x="612" y="234">power, install</text>
    <text x="600" y="256">• radio: Wi-Fi</text>
    <text x="612" y="272">+ Bluetooth</text>
  </g>
  <text x="360" y="410" font-size="11" text-anchor="middle" fill="#6b7280">Illustration, not to scale – the position of the parts differs between board revisions</text>
</svg>
